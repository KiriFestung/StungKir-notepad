# Приложение для телефона (Android): проверки логики и сборка APK.
# Готовый файл - во вкладке Actions → нужный запуск → Artifacts → «StungKir-Android».
name: Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android - проверки и APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Проверки и сборка
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testReleaseUnitTest assembleRelease 2>&1 | tee ../gradle.log
      - name: Ошибки сборки - в заметки запуска
        if: failure()
        shell: bash
        run: |
          # главное из журнала - заметкой на странице запуска (её видно и без скачивания журнала)
          grep -E "^e: |error:|What went wrong|FAILED|Exception|> .*failed|expected:<|at page\.codeberg" gradle.log \
            | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -40 gradle.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Сборка Android::${msg}"
      - name: Имя файла
        run: cp android/app/build/outputs/apk/release/app-release.apk StungKir-Android.apk
      - uses: actions/upload-artifact@v4
        # место под артефакты у закрытого репозитория маленькое (~500 МБ), а готовые файлы и так в «Релизах»:
        # держим недолго, и если места нет - сборка не падает
        continue-on-error: true
        with:
          name: StungKir-Android
          path: StungKir-Android.apk
          retention-days: 3
      - name: Выложить APK в «Релизы» (удобно качать прямо с телефона)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          # без настоящего ключа сборка не встанет поверх прежней - такую не выкладываем
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning title=Android::Нет секрета ANDROID_KEYSTORE_PASSWORD - APK собран, но в «Релизы» не выложен"
            gh release delete android-latest --yes --cleanup-tag || true
            exit 0
          fi
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest StungKir-Android.apk --prerelease \
            --target "${{ github.sha }}" --title "StungKir для Android - свежая сборка" \
            --notes "Последняя сборка приложения для телефона. Как поставить и связать с компьютером: docs/ТЕЛЕФОН.md"
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: android-test-report
          path: android/app/build/reports/
